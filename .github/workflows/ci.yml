name: CI

on:
  push:
    branches-ignore:
      - main
      - feat/second-deployment  # cd-research.yml runs the same tests before release
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
